name: Daily check

on:
  schedule:
    - cron: '17 6 * * *' # about 7am UK time
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the charity register (free daily file, no key)
        run: npm run register
        continue-on-error: true # website checks still run if the download fails
      - run: npm run checks

      - name: Save results (data, live PMO notes, directory page)
        run: |
          touch data/register.json
          git config user.name "ndsa-org-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/register.json "ndsa-PMO/30 Live" "ndsa-PMO/00 Start here/00 Dashboard.md" site
          if ! git diff --cached --quiet; then
            git commit -m "chore(check): daily check $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Post new flags to the "Services to review" issue
        if: hashFiles('out/new-flags.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search 'in:title "Services to review"' --json number -q '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --title "Services to review" --body-file out/new-flags.md
          else
            gh issue comment "$n" --body-file out/new-flags.md
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
