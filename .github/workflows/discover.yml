name: Discover candidates

# Weekly: reads the charity registers of all four nations and refreshes the review list.
# Nothing found here goes on the directory until an admin adds it.
on:
  schedule:
    - cron: '41 5 * * 1' # Mondays, before the daily check
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run discover
      - name: Save the review list
        run: |
          git config user.name "ndsa-org-checker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json "ndsa-PMO/30 Live/Candidates.md"
          if ! git diff --cached --quiet; then
            git commit -m "chore(discover): weekly candidates $(date -u +%F)"
            git pull --rebase
            git push
          fi
